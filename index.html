<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="btn theme" id="theme" aria-label="Toggle theme">🌙</button>
<div class="app">
  <aside class="card">
    <h2 class="lib">Operation library</h2>
    <input id="q" type="text" placeholder="Search operations…" aria-label="Search operations" autocomplete="off">
    <div class="list" id="list"></div>
  </aside>
  <main class="card">
    <div class="top">
      <div><p class="cnt" id="cnt"></p><h1 id="title"></h1></div>
      <span class="tag">Stack</span>
    </div>
    <p class="desc" id="desc"></p>
    <div id="inwrap"><label class="f" for="inp">Value</label><input id="inp" type="text" maxlength="10" autocomplete="off" placeholder="Type a value"></div>
    <p class="hint" id="hint"></p>
    <div class="btns">
      <button class="btn run" id="run">▶ Run operation</button>
      <button class="btn" id="reset">Reset stack</button>
      <button class="btn" id="copy">Copy result</button>
    </div>
    <div class="cap"><label for="capacity">Capacity</label><input id="capacity" type="range" min="1" max="10" value="8"><b id="capv">8</b></div>
    <div class="viz">
      <div class="stack" id="stack"><div class="empty" id="emptyMsg"><span>🫧</span>nothing here yet</div></div>
      <div class="stats">
        <div class="stat"><b id="size">0</b><small>Size</small></div>
        <div class="stat"><b id="topv">-</b><small>Top</small></div>
        <div class="stat"><b id="free">8</b><small>Free</small></div>
      </div>
    </div>
    <div class="out"><div>
      <div class="oh"><span class="ol">Output</span><span id="st">Ready</span></div>
      <pre id="res" role="status">Ready. Press Run operation to see the result.</pre>
    </div></div>
    <div class="contact">Made with love by <b>Thea Vithean</b><br>
      <a href="https://t.me/theavithean" target="_blank" rel="noopener noreferrer">Follow on Telegram</a></div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
